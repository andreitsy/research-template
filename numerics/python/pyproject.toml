[project]
name = "two-level-template"
version = "0.1.0"
description = "Template: real-time evolution of a two-level system H = omega sigma_x."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2",
    "matplotlib>=3.10",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
